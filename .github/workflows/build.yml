name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release"
        type: boolean
        required: false
        default: true
      release_channel:
        description: "Release channel"
        type: choice
        options: [stable, nightly]
        default: stable
      version_bump:
        description: "Semver bump type"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      max_build_attempts:
        description: "Retry whole archive+pack until success (max)"
        type: number
        required: false
        default: 5
      release_name:
        description: "Release title"
        type: string
        required: false
        default: ""
      summary:
        description: "Short summary"
        type: string
        required: false
        default: ""
      features:
        description: "New Features (one per line)"
        type: string
        required: false
        default: ""
      improvements:
        description: "Improvements (one per line)"
        type: string
        required: false
        default: ""
      bug_fixes:
        description: "Bug Fixes (one per line)"
        type: string
        required: false
        default: ""
      notes:
        description: "Extra notes"
        type: string
        required: false
        default: ""

concurrency:
  group: lc-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}
      has_stik: ${{ steps.pack.outputs.has_stik }}
      sidestore_version: ${{ steps.pack.outputs.sidestore_version }}
      stik_version: ${{ steps.pack.outputs.stik_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure OpenSSL + critical sources
        run: |
          set -euo pipefail
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true

          OPENSSL_TAG="3.6.5000"
          if [ ! -d OpenSSL/Frameworks/OpenSSL.xcframework/ios-arm64 ]; then
            echo "Fetching OpenSSL ${OPENSSL_TAG}..."
            rm -rf OpenSSL
            mkdir -p OpenSSL/Frameworks
            curl -fsSL -o /tmp/OpenSSL.xcframework.zip \
              "https://github.com/krzyzanowskim/OpenSSL/releases/download/${OPENSSL_TAG}/OpenSSL.xcframework.zip"
            rm -rf /tmp/openssl_extract
            mkdir -p /tmp/openssl_extract
            unzip -qo /tmp/OpenSSL.xcframework.zip -d /tmp/openssl_extract
            FOUND=$(find /tmp/openssl_extract -type d -name OpenSSL.xcframework | head -1)
            test -n "$FOUND"
            mv "$FOUND" OpenSSL/Frameworks/OpenSSL.xcframework
            rm -rf /tmp/openssl_extract /tmp/OpenSSL.xcframework.zip
          fi

          # Strip signatures to avoid ProcessXCFramework signature failures on CI
          find OpenSSL/Frameworks/OpenSSL.xcframework -type d -name '_CodeSignature' -exec rm -rf {} + 2>/dev/null || true

          test -d OpenSSL/Frameworks/OpenSSL.xcframework/ios-arm64
          echo "OpenSSL OK"

          # Fail fast if critical sources empty
          for f in \
            MultitaskSupport/UIKitPrivate+MultitaskSupport.h \
            TweakLoader/UIKit+GuestHooks.m \
            LiveContainer/UIKitPrivate.h
          do
            if [ ! -s "$f" ]; then echo "EMPTY: $f"; exit 1; fi
            echo "OK $f ($(wc -c < "$f") bytes)"
          done

          # Drop expectedSignature gate in pbxproj
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p = Path("LiveContainer.xcodeproj/project.pbxproj")
          t = p.read_text()
          t2 = re.sub(r'expectedSignature = "[^"]*";\s*', '', t)
          if t2 != t:
              p.write_text(t2)
              print("stripped expectedSignature")
          PY2

          if [ ! -f litehook/src/litehook.c ] && [ ! -f litehook/litehook.c ]; then
            rm -rf litehook
            git clone --depth 1 https://github.com/LiveContainer/litehook.git litehook
          fi

      - name: Resolve version (semver)
        id: version
        run: |
          set -e
          BASE="4.2.6"
          if [ -f VERSION ]; then BASE=$(tr -d '[:space:]' < VERSION); fi
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -n "$LATEST_TAG" ]; then BASE="${LATEST_TAG#v}"; fi
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP" ]; then BUMP="patch"; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then BUMP="none"
          elif [ "${{ github.event_name }}" = "push" ]; then BUMP="patch"
          elif [ "${{ inputs.release_channel }}" = "nightly" ]; then BUMP="none"
          fi
          IFS=. read -r MAJ MIN PAT <<EOF
          $BASE
          EOF
          MAJ=${MAJ:-4}; MIN=${MIN:-2}; PAT=${PAT:-6}
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
            none) ;;
            *) PAT=$((PAT+1)) ;;
          esac
          VER="${MAJ}.${MIN}.${PAT}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION
          echo "==> Version: $VER"

      - name: Resolve project
        id: proj
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcworkspace$' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -A | grep -i '\.xcodeproj$' | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive + Pack (retry until success)
        id: pack
        timeout-minutes: 100
        run: |
          set -euo pipefail
          MAX="${{ github.event.inputs.max_build_attempts }}"
          if [ -z "$MAX" ] || [ "$MAX" -lt 1 ]; then MAX=5; fi
          chmod +x .github/build_github.sh
          export LC_BUILD_VERSION="${{ steps.version.outputs.version }}"
          echo "LC_BUILD_VERSION=$LC_BUILD_VERSION"

          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX" ]; do
            echo ""
            echo "========== BUILD ATTEMPT ${ATTEMPT}/${MAX} (commit ${GITHUB_SHA}) =========="

            rm -rf "${archive_path}.xcarchive" Payload tmp
            rm -f "${scheme}.ipa" "${scheme}+SideStore.ipa"

            set +e
            xcodebuild archive \
              -archivePath "$archive_path" \
              -scheme "$scheme" \
              -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -configuration Release \
              MARKETING_VERSION="${{ steps.version.outputs.version }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              > /tmp/xcodebuild_archive.log 2>&1
            ARCHIVE_RC=$?
            set -e

            if [ "$ARCHIVE_RC" -ne 0 ]; then
              echo "Archive failed (rc=$ARCHIVE_RC) on attempt ${ATTEMPT}"
              grep -E "error:|ProcessXCFramework|fatal|ARCHIVE FAILED" /tmp/xcodebuild_archive.log | tail -40 || true
              tail -40 /tmp/xcodebuild_archive.log || true
              if [ "$ATTEMPT" -eq "$MAX" ]; then exit 1; fi
              sleep $((ATTEMPT * 20))
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            set +e
            sh .github/build_github.sh
            PACK_RC=$?
            set -e

            if [ -f "${scheme}.ipa" ]; then
              echo "==> SUCCESS on attempt ${ATTEMPT}: LiveContainer.ipa ready"
              ls -lh *.ipa || true
              break
            fi

            echo "Pack failed (rc=$PACK_RC) — no LiveContainer.ipa on attempt ${ATTEMPT}"
            if [ "$ATTEMPT" -eq "$MAX" ]; then
              echo "ERROR: exhausted ${MAX} attempts without LiveContainer.ipa"
              exit 1
            fi
            sleep $((ATTEMPT * 20))
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ -f "${scheme}+SideStore.ipa" ]; then
            echo "has_sidestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sidestore=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f sidestore_version.txt ]; then
            echo "sidestore_version=$(tr -d '\r\n' < sidestore_version.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "sidestore_version=not bundled" >> "$GITHUB_OUTPUT"
          fi
          if [ -f stikdebug_version.txt ]; then
            echo "stik_version=$(tr -d '\r\n' < stikdebug_version.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "stik_version=not bundled" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        if: steps.pack.outputs.has_sidestore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Release
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LiveContainer+SideStore.ipa

      - name: Prepare release
        id: prep
        run: |
          set -euo pipefail
          VER="${{ needs.build.outputs.version }}"
          SS="${{ needs.build.outputs.sidestore_version }}"
          ST="${{ needs.build.outputs.stik_version }}"
          CHANNEL="${{ inputs.release_channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then CHANNEL="stable"; else CHANNEL="nightly"; fi
          fi
          if [ "$CHANNEL" = "nightly" ]; then
            TAG="nightly"
            TITLE="${VER}"
          else
            TAG="v${VER}"
            TITLE="${{ inputs.release_name }}"
            if [ -z "$TITLE" ]; then TITLE="${VER}"; fi
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              TAG="${TAG}-$(date -u +%Y%m%d%H%M)"
            fi
          fi
          {
            echo "# LiveContainer Extended ${VER}"
            echo ""
            echo "| Component                  | Version                              |"
            echo "| -------------------------- | ------------------------------------ |"
            echo "| **LiveContainer Extended** | \`${VER}\` |"
            echo "| **Embedded SideStore**     | \`${SS}\` |"
            echo ""
            echo ""
            echo "> [!Warning]"
            echo "> Standalone build needs **SideStore 0.6.2+** or **AltStore 2.2.1+**."
            echo "> For \`LiveContainer+SideStore.ipa\` use [Impactor](https://github.com/khcrysalis/Impactor) or [iloader](https://github.com/nab138/iloader)."
            echo ""
            echo "## New Features"
            echo ""
            FEATURES="${{ inputs.features }}"
            if [ -n "$(printf '%s' "$FEATURES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$FEATURES" | sed '/^[[:space:]]*$/d' | sed 's/^/- /'
            else
              echo "- (none listed)"
            fi
            echo ""
            echo "## Improvements"
            echo ""
            IMPROVEMENTS="${{ inputs.improvements }}"
            if [ -n "$(printf '%s' "$IMPROVEMENTS" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$IMPROVEMENTS" | sed '/^[[:space:]]*$/d' | sed 's/^/- /'
            else
              echo "- (none listed)"
            fi
            echo ""
            echo "## Bug Fixes"
            echo ""
            BUGFIXES="${{ inputs.bug_fixes }}"
            if [ -n "$(printf '%s' "$BUGFIXES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$BUGFIXES" | sed '/^[[:space:]]*$/d' | sed 's/^/- /'
            else
              echo "- (none listed)"
            fi
            echo ""
            echo "## Notes"
            echo ""
            NOTES="${{ inputs.notes }}"
            SUMMARY="${{ inputs.summary }}"
            if [ -n "$(printf '%s' "$SUMMARY" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$SUMMARY"
              echo ""
            fi
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$NOTES"
            else
              echo "-"
            fi
            echo ""
            echo "## Credits"
            echo "- **Lead Developer:** Nguyen Quang Dung"
            echo "- Based on [LiveContainer](https://github.com/LiveContainer/LiveContainer)"
          } > release_body.txt
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="${{ steps.prep.outputs.title }}"
          CHANNEL="${{ steps.prep.outputs.channel }}"
          ASSETS=(LiveContainer.ipa)
          [ -f LiveContainer+SideStore.ipa ] && ASSETS+=(LiveContainer+SideStore.ipa)
                    test -f LiveContainer.ipa

          if [ "$CHANNEL" = "nightly" ]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}" --force
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release_body.txt --prerelease
              for a in "${ASSETS[@]}"; do gh release upload "$TAG" "$a" --clobber; done
            else
              gh release create "$TAG" --title "$TITLE" --notes-file release_body.txt --prerelease "${ASSETS[@]}"
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release_body.txt
              for a in "${ASSETS[@]}"; do gh release upload "$TAG" "$a" --clobber; done
            else
              gh release create "$TAG" --title "$TITLE" --notes-file release_body.txt --latest "${ASSETS[@]}"
            fi
          fi
          echo "Released $TAG with ${ASSETS[*]}"
