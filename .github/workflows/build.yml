name: Xcode - Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release"
        type: boolean
        required: false
        default: true
      release_channel:
        description: "Release channel"
        type: choice
        options: [stable, nightly]
        default: stable
      version_bump:
        description: "Semver bump type"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      max_build_attempts:
        description: "Retry whole archive+pack until success (max)"
        type: number
        required: false
        default: 5
      release_name:
        description: "Release title"
        type: string
        required: false
        default: ""
      summary:
        description: "Short summary"
        type: string
        required: false
        default: ""
      features:
        description: "New Features (one per line)"
        type: string
        required: false
        default: ""
      improvements:
        description: "Improvements (one per line)"
        type: string
        required: false
        default: ""
      bug_fixes:
        description: "Bug Fixes (one per line)"
        type: string
        required: false
        default: ""
      notes:
        description: "Extra notes"
        type: string
        required: false
        default: ""

concurrency:
  group: lc-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build LiveContainer IPA
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      has_sidestore: ${{ steps.pack.outputs.has_sidestore }}
      sidestore_version: ${{ steps.pack.outputs.sidestore_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure OpenSSL + submodules
        run: |
          set -euo pipefail

          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true

          OPENSSL_TAG="3.6.5000"
          echo "Installing OpenSSL ${OPENSSL_TAG}..."
          rm -rf OpenSSL
          mkdir -p OpenSSL/Frameworks
          curl -fsSL -o /tmp/OpenSSL.xcframework.zip \
            "https://github.com/krzyzanowskim/OpenSSL/releases/download/${OPENSSL_TAG}/OpenSSL.xcframework.zip"
          rm -rf /tmp/openssl_extract
          mkdir -p /tmp/openssl_extract
          unzip -qo /tmp/OpenSSL.xcframework.zip -d /tmp/openssl_extract
          rm -f /tmp/OpenSSL.xcframework.zip
          FOUND=$(find /tmp/openssl_extract -type d -name OpenSSL.xcframework | head -1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: OpenSSL.xcframework not found in release zip"
            find /tmp/openssl_extract | head -50
            exit 1
          fi
          mv "$FOUND" OpenSSL/Frameworks/OpenSSL.xcframework
          rm -rf /tmp/openssl_extract

          find OpenSSL/Frameworks/OpenSSL.xcframework -type d -name '_CodeSignature' -exec rm -rf {} + 2>/dev/null || true
          find OpenSSL/Frameworks/OpenSSL.xcframework -name '*.signature' -delete 2>/dev/null || true

          test -d OpenSSL/Frameworks/OpenSSL.xcframework/ios-arm64
          echo "OpenSSL.xcframework ready"
          ls OpenSSL/Frameworks/OpenSSL.xcframework

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("LiveContainer.xcodeproj/project.pbxproj")
          t = p.read_text()
          t2 = re.sub(r'expectedSignature = "[^"]*";\s*', '', t)
          t2 = t2.replace(
              "OpenSSL/Frameworks/iphoneos/OpenSSL.framework",
              "OpenSSL/Frameworks/OpenSSL.xcframework",
          )
          t2 = t2.replace(
              "$(PROJECT_DIR)/OpenSSL/Frameworks/iphoneos",
              "$(PROJECT_DIR)/OpenSSL/Frameworks",
          )
          p.write_text(t2)
          print("pbxproj patched")
          PY

          if [ ! -f litehook/litehook.c ] && [ ! -f litehook/README.md ]; then
            rm -rf litehook
            git clone --depth 1 https://github.com/LiveContainer/litehook.git litehook
          fi
          if [ ! -f fishhook/fishhook.c ] && [ ! -d fishhook ]; then
            rm -rf fishhook
            git clone --depth 1 https://github.com/LiveContainer/fishhook.git fishhook || true
          fi


      - name: Verify critical sources not empty
        run: |
          set -euo pipefail
          FAIL=0
          for f in \
            MultitaskSupport/UIKitPrivate+MultitaskSupport.h \
            LiveContainer/Tweaks/NSBundle+FixCydiaSubstrate.m \
            LiveContainer/Tweaks/NSFileManager+GuestHooks.m \
            LiveContainer/Tweaks/NSURLSessionConfiguration+GuestHooks.m \
            TweakLoader/UIKit+GuestHooks.m \
            LiveContainer/UIKitPrivate.h \
            LiveContainer/FoundationPrivate.h
          do
            if [ ! -s "$f" ]; then
              echo "EMPTY OR MISSING: $f"
              FAIL=1
            else
              echo "OK $f ($(wc -c < "$f") bytes)"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Critical source files are empty — restore from upstream before building"
            exit 1
          fi

      - name: Resolve version (semver)
        id: version
        run: |
          set -euo pipefail
          BASE="4.2.6"
          if [ -f VERSION ]; then BASE=$(tr -d '[:space:]' < VERSION); fi
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -n "$LATEST_TAG" ]; then BASE="${LATEST_TAG#v}"; fi
          if [ -f VERSION ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE=$(tr -d '[:space:]' < VERSION)
          fi
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP" ]; then BUMP="patch"; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUMP="none"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BUMP="patch"
          elif [ "${{ inputs.release_channel }}" = "nightly" ]; then
            BUMP="none"
          fi
          IFS=. read -r MA MI PA <<EOF
          $BASE
          EOF
          MA=${MA:-4}; MI=${MI:-2}; PA=${PA:-6}
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            none) ;;
            *) PA=$((PA+1)) ;;
          esac
          VER="${MA}.${MI}.${PA}"
          if [ "${{ inputs.release_channel }}" = "nightly" ] || [ "${{ github.event_name }}" = "push" ]; then
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            VER="${VER}+${SHORT}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"
          echo "${VER}" > VERSION
          echo "LC_BUILD_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Detect project type
        id: proj
        run: |
          if ls *.xcworkspace 1>/dev/null 2>&1; then
            echo "filetype=workspace" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -d *.xcworkspace | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "filetype=project" >> "$GITHUB_OUTPUT"
            echo "file=$(ls -d *.xcodeproj | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive + Pack (retry loop)
        id: pack
        env:
          LC_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MAX="${{ github.event.inputs.max_build_attempts }}"
          if [ -z "$MAX" ] || [ "$MAX" = "null" ]; then MAX=5; fi
          scheme="${{ env.scheme }}"
          archive_path="${{ env.archive_path }}"
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX" ]; do
            echo "========== BUILD ATTEMPT ${ATTEMPT}/${MAX} (commit ${{ github.sha }}) =========="
            rm -rf "${archive_path}.xcarchive" "${scheme}.ipa" "${scheme}+SideStore.ipa" DerivedData || true

            set +e
            xcodebuild archive \
              -archivePath "$archive_path" \
              -scheme "$scheme" \
              -${{ steps.proj.outputs.filetype }} "${{ steps.proj.outputs.file }}" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -configuration Release \
              MARKETING_VERSION="${{ steps.version.outputs.version }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM= \
              PROVISIONING_PROFILE_SPECIFIER= \
              ONLY_ACTIVE_ARCH=NO \
              > /tmp/xcodebuild_archive.log 2>&1
            XC_RC=$?
            set -e

            if [ "$XC_RC" -ne 0 ]; then
              echo "Archive failed (rc=${XC_RC}) on attempt ${ATTEMPT}"
              grep -E "error:|ProcessXCFramework|fatal|ARCHIVE FAILED|failed" /tmp/xcodebuild_archive.log | tail -60 || true
              echo "---- last 80 lines ----"
              tail -80 /tmp/xcodebuild_archive.log
              if [ "$ATTEMPT" -eq "$MAX" ]; then
                echo "ERROR: exhausted ${MAX} archive attempts"
                exit 1
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep $((ATTEMPT * 15))
              continue
            fi
            echo "Archive OK"

            set +e
            LC_BUILD_VERSION="${{ steps.version.outputs.version }}" bash .github/build_github.sh
            PACK_RC=$?
            set -e
            if [ "$PACK_RC" -ne 0 ] || [ ! -f "${scheme}.ipa" ]; then
              echo "Pack failed (rc=${PACK_RC}) on attempt ${ATTEMPT}"
              if [ "$ATTEMPT" -eq "$MAX" ]; then
                echo "ERROR: exhausted ${MAX} pack attempts without ${scheme}.ipa"
                exit 1
              fi
              ATTEMPT=$((ATTEMPT + 1))
              sleep $((ATTEMPT * 15))
              continue
            fi

            echo "Pack OK: $(ls -lh "${scheme}.ipa")"
            break
          done

          if [ -f "${scheme}+SideStore.ipa" ]; then
            echo "has_sidestore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sidestore=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f sidestore_version.txt ]; then
            echo "sidestore_version=$(tr -d '\r\n' < sidestore_version.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "sidestore_version=not bundled" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload LiveContainer+SideStore.ipa
        if: steps.pack.outputs.has_sidestore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Release
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: LiveContainer.ipa

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LiveContainer+SideStore.ipa

      - name: Prepare release
        id: prep
        run: |
          set -euo pipefail
          VER="${{ needs.build.outputs.version }}"
          SS="${{ needs.build.outputs.sidestore_version }}"
          CHANNEL="${{ inputs.release_channel }}"
          if [ -z "$CHANNEL" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then CHANNEL="stable"; else CHANNEL="nightly"; fi
          fi
          if [ "$CHANNEL" = "nightly" ]; then
            TAG="nightly"
            TITLE="${VER}"
          else
            TAG="v${VER}"
            TITLE="${{ inputs.release_name }}"
            if [ -z "$TITLE" ]; then TITLE="${VER}"; fi
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              TAG="${TAG}-$(date -u +%Y%m%d%H%M)"
            fi
          fi
          SUMMARY="${{ inputs.summary }}"
          FEATURES="${{ inputs.features }}"
          IMPROVEMENTS="${{ inputs.improvements }}"
          BUGFIXES="${{ inputs.bug_fixes }}"
          NOTES="${{ inputs.notes }}"
          {
            echo "# LiveContainer Extended ${VER}"
            echo ""
            echo "| Component                  | Version                              |"
            echo "| -------------------------- | ------------------------------------ |"
            echo "| **LiveContainer Extended** | \`${VER}\` |"
            echo "| **Embedded SideStore**     | \`${SS}\` |"
            echo ""
            if [ -n "$(printf '%s' "$SUMMARY" | tr -d '[:space:]')" ]; then
              echo "## Summary"
              echo "$SUMMARY"
              echo ""
            fi
            echo "## New Features"
            if [ -n "$(printf '%s' "$FEATURES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$FEATURES"
            else
              echo "-"
            fi
            echo ""
            echo "## Improvements"
            if [ -n "$(printf '%s' "$IMPROVEMENTS" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$IMPROVEMENTS"
            else
              echo "-"
            fi
            echo ""
            echo "## Bug Fixes"
            if [ -n "$(printf '%s' "$BUGFIXES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$BUGFIXES"
            else
              echo "-"
            fi
            echo ""
            echo "## Notes"
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$NOTES"
            else
              echo "-"
            fi
            echo ""
            echo "## Credits"
            echo "- **Lead Developer:** Nguyen Quang Dung"
            echo "- Based on [LiveContainer](https://github.com/LiveContainer/LiveContainer)"
          } > release_body.txt
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="${{ steps.prep.outputs.title }}"
          CHANNEL="${{ steps.prep.outputs.channel }}"
          ASSETS=(LiveContainer.ipa)
          [ -f LiveContainer+SideStore.ipa ] && ASSETS+=(LiveContainer+SideStore.ipa)
          test -f LiveContainer.ipa

          if [ "$CHANNEL" = "nightly" ]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}" --force
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release_body.txt --prerelease
              for a in "${ASSETS[@]}"; do gh release upload "$TAG" "$a" --clobber; done
            else
              gh release create "$TAG" --title "$TITLE" --notes-file release_body.txt --prerelease "${ASSETS[@]}"
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release_body.txt
              for a in "${ASSETS[@]}"; do gh release upload "$TAG" "$a" --clobber; done
            else
              gh release create "$TAG" --title "$TITLE" --notes-file release_body.txt --latest "${ASSETS[@]}"
            fi
          fi
          echo "Released $TAG with ${ASSETS[*]}"
