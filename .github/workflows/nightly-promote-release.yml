name: Promote Nightly → Public Release

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-upload onto existing public tag"
        type: boolean
        default: false
      nightly_tag:
        description: "Source prerelease tag"
        type: string
        default: nightly

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote nightly to public release
        env:
          # gh uses GH_TOKEN automatically — do NOT run `gh auth login`
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ github.event.inputs.nightly_tag || 'nightly' }}
          FORCE_PROMOTE: ${{ github.event.inputs.force == true && '1' || '0' }}
        run: |
          set -euo pipefail
          command -v gh
          gh --version
          chmod +x .github/promote_nightly_release.sh
          ./.github/promote_nightly_release.sh
