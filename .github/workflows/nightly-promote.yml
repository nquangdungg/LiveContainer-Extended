name: Promote nightly to release (PR)

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run nightly promotion (PR path)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/workflows/promote_nightly.sh || true
          if [ -f .github/workflows/promote_nightly.sh ]; then
            bash .github/workflows/promote_nightly.sh
          else
            echo "promote_nightly.sh missing"
            exit 0
          fi
